# Note: Before using this configuration, you must replace the placeholder entity IDs
# (e.g., light.audioleds_your_device) with the actual entity IDs from your integration.
# You can find your entity IDs in Settings -> Devices & Services -> Entities.

# =================================================================================
# Main Device Control Card
# =================================================================================
# This card groups the primary controls for the AudioLEDs device.
type: entities
title: AudioLEDs Control
entities:
  # Replace 'light.audioleds_your_device' with your actual light entity ID
  - entity: light.audioleds_your_device
  # Replace the following entities with your actual sensor/number/select entity IDs
  - entity: number.audioleds_your_device_gain
  - entity: number.audioleds_your_device_smooth_size
  - entity: number.audioleds_your_device_skew
  - entity: select.audioleds_your_device_display_mode
  - entity: select.audioleds_your_device_animation_mode
  - entity: select.audioleds_your_device_fft_size
  - entity: light.audioleds_your_device_color_2
  - entity: light.audioleds_your_device_color_3

# =================================================================================
# Preset Management Section
# =================================================================================

# ---------------------------------------------------------------------------------
# A. Save Preset Card
# ---------------------------------------------------------------------------------
# This card uses the input helpers you created to save a new preset.
type: entities
title: Save New Preset
entities:
  # These helpers should be created in Settings -> Devices & Services -> Helpers
  - entity: input_number.audioleds_preset_index
    name: Preset Slot (0-19)
  - entity: input_text.audioleds_preset_name
    name: Preset Name
footer:
  type: buttons
  entities:
    - name: Save Preset
      icon: mdi:content-save
      show_state: false
      tap_action:
        action: call-service
        service: audioleds.save_preset
        # The service call targets one of your device's entities
        target:
          # Replace 'light.audioleds_your_device' with one of your actual device entities
          entity_id: light.audioleds_your_device
        data:
          preset_index: "{{ states('input_number.audioleds_preset_index') | int }}"
          preset_name: "{{ states('input_text.audioleds_preset_name') }}"

# ---------------------------------------------------------------------------------
# B. Preset List and Actions Card
# ---------------------------------------------------------------------------------
# This card dynamically lists saved presets from the sensor and provides
# "Activate" and "Delete" buttons.
# Requires auto-entities and button-card from HACS.
type: custom:auto-entities
card:
  type: entities
  title: Saved Presets
filter:
  template: >
    {% for preset in state_attr('sensor.audioleds_your_device_presets', 'presets') %}
      {{
        {
          'type': 'custom:button-card',
          'entity': 'sensor.audioleds_your_device_presets',
          'name': preset.name ~ ' (Slot ' ~ preset.index ~ ')',
          'template': 'list_item',
          'tap_action': {
            'action': 'call-service',
            'service': 'audioleds.activate_preset',
            'target': {
              'entity_id': 'sensor.audioleds_your_device_presets'
            },
            'service_data': { 'preset_index': preset.index }
          },
          'hold_action': {
            'action': 'call-service',
            'service': 'audioleds.delete_preset',
            'target': {
              'entity_id': 'sensor.audioleds_your_device_presets'
            },
            'service_data': { 'preset_index': preset.index }
          }
        }
      }},
    {% endfor %}

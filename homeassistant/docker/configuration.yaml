# Home Assistant base defaults (frontend, api, etc.)
default_config:

# Time zone (adjust)
homeassistant:
  time_zone: UTC

# Logger setup with debug for the custom integration
logger:
  default: info
  logs:
    custom_components.audioleds: debug

